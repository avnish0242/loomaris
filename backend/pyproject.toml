[tool.poetry]
name = "loomaris-backend"
version = "0.1.0"
description = "Loomaris AI app builder — backend API"
authors = ["Avnish Kumar <avnish.dbg@gmail.com>"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = ">=0.115.0"
uvicorn = { version = ">=0.32.0", extras = ["standard"] }
sqlalchemy = { version = ">=2.0.36", extras = ["asyncio"] }
asyncpg = ">=0.30.0"
psycopg2-binary = ">=2.9.0"
alembic = ">=1.13.0"
pydantic-settings = ">=2.5.0"
pydantic = { version = ">=2.9.0", extras = ["email"] }
python-jose = { version = ">=3.3.0", extras = ["cryptography"] }
authlib = ">=1.3.2"
httpx = ">=0.27.0"
cryptography = ">=43.0.0"
boto3 = ">=1.35.0"
anthropic = ">=0.40.0"
redis = ">=5.2.0"
celery = { version = ">=5.4.0", extras = ["redis"] }
python-multipart = ">=0.0.12"
itsdangerous = ">=2.2.0"
email-validator = ">=2.2.0"
starlette = ">=0.41.0"
gitpython = ">=3.1.0"
docker = ">=7.0.0"
detect-secrets = ">=1.4.0"
msal = ">=1.24.0"
structlog = ">=24.0.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0"
pytest-asyncio = ">=0.23.0"
ruff = ">=0.4.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
