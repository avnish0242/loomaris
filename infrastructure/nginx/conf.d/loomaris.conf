# ── HTTP: ACME challenge + redirect to HTTPS ──────────────────────────────────
# Only handles app. and api. — loomaris.xyz / www. are on Netlify
server {
    listen      80;
    server_name app.loomaris.xyz api.loomaris.xyz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── app.loomaris.xyz → Next.js chat application ───────────────────────────────
server {
    listen      443 ssl;
    http2       on;
    server_name app.loomaris.xyz;

    ssl_certificate     /etc/letsencrypt/live/app.loomaris.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.loomaris.xyz/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass         http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}

# ── api.loomaris.xyz → FastAPI backend ───────────────────────────────────────
server {
    listen      443 ssl;
    http2       on;
    server_name api.loomaris.xyz;

    ssl_certificate     /etc/letsencrypt/live/app.loomaris.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.loomaris.xyz/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # SSE streams must not be buffered — Claude token-by-token delivery depends on this
    proxy_buffering    off;
    proxy_read_timeout 600s;

    location / {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
