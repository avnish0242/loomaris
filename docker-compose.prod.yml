services:

  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: loomaris
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: loomaris
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loomaris"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Not exposed externally — backend connects over the Docker network
    expose:
      - "5432"

  redis:
    image: redis:7-alpine
    restart: always
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    env_file:
      - .env        # production values — copy from .env.production and fill in
    environment:
      DATABASE_URL: postgresql+asyncpg://loomaris:${POSTGRES_PASSWORD}@postgres:5432/loomaris
      REDIS_URL: redis://redis:6379/0
      APP_ENV: production
      DOMAIN: loomaris.xyz
      FRONTEND_URL: https://app.loomaris.xyz
      BACKEND_URL: https://api.loomaris.xyz
      GOOGLE_REDIRECT_URI: https://api.loomaris.xyz/api/v1/auth/google/callback
    volumes:
      - repos_data:/repos
      - /var/run/docker.sock:/var/run/docker.sock
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: https://api.loomaris.xyz
    restart: always
    environment:
      NODE_ENV: production
    expose:
      - "3000"
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./infrastructure/certbot/conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - backend
      - frontend

  # Runs certbot renew every 12 hours — certificates auto-rotate before expiry
  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - ./infrastructure/certbot/conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: >
      /bin/sh -c "trap exit TERM;
        while :; do
          certbot renew --quiet;
          sleep 12h & wait $${!};
        done"

volumes:
  postgres_data:
  repos_data:
  certbot_www:
